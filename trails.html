<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EBAVGD // QUANT TRAILS</title>
    <script src="https://api-maps.yandex.ru/2.1/?lang=ru_RU" type="text/javascript"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #07090e; overflow: hidden; }
        #map { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        #version-tag {
            position: absolute; top: 10px; left: 10px;
            background: rgba(13,17,23,0.95); color: #00ff66;
            padding: 6px 12px; border: 1px solid #30363d; border-radius: 4px;
            font-family: monospace; font-size: 12px; font-weight: bold;
            z-index: 1000; box-shadow: 0 0 10px rgba(0,255,102,0.3);
            pointer-events: none;
        }
        #hint {
            display: none;
            position: absolute; top: 46px; left: 10px; right: 10px;
            background: rgba(13,17,23,0.95); color: #66c2ff;
            padding: 10px 14px; border: 1px solid #0088ff; border-radius: 4px;
            font-family: monospace; font-size: 12px;
            z-index: 1000; box-shadow: 0 0 10px rgba(0,136,255,0.35);
            pointer-events: none; text-align: center;
        }
    </style>
</head>
<body>
<div id="version-tag">SYSTEM // QUANT_TRAILS v1.1.1</div>
<div id="hint">Карта не знает сейчас в каком вы кванте. Перейдите по ссылке из @EBAVGD_bot</div>
<div id="map"></div>
<script type="text/javascript">
    var B64_ALPHABET = "0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ-_";

    function decodeB64(str) {
        if (typeof str !== 'string' || str.length === 0) return -1;
        var v = 0;
        for (var i = 0; i < str.length; i++) {
            var idx = B64_ALPHABET.indexOf(str.charAt(i));
            if (idx === -1) return -1;
            v = v * 64 + idx;
        }
        return v;
    }

    function getLoraQuantName(sysCode) {
        if (!sysCode || sysCode.length !== 2) return sysCode;
        var t = decodeB64(sysCode);
        if (t < 0) return "???";
        if (t <= 59)  return "Квант А" + t;
        if (t <= 91)  return "Квант Б" + (t - 59);
        if (t <= 122) return "Квант В" + (t - 91);
        if (t <= 177) return "Квант Г" + (t - 122);
        if (t <= 190) return "Квант Д" + (t - 177);
        if (t <= 241) return "Квант Е" + (t - 190);
        return sysCode;
    }

    // Плюрализация. По умолчанию работает как обычный русский плюрал
    // (1 / 2-4 / 5+), но можно передать one === few === many, чтобы получить
    // упрощённые формы, например plural(n, "побывал", "побывало", "побывало").
    function plural(n, one, few, many) {
        var mod100 = Math.abs(n) % 100;
        var mod10  = mod100 % 10;
        if (mod100 > 10 && mod100 < 20) return many;
        if (mod10 === 1)               return one;
        if (mod10 >= 2 && mod10 <= 4)  return few;
        return many;
    }

    function showHint() {
        document.getElementById('hint').style.display = 'block';
    }

    ymaps.ready(function () {
        Promise.all([
            fetch('locations.json').then(function (r) { return r.json(); }),
            fetch('washere.json').then(function (r) { return r.json(); })
        ]).then(function (res) {
            renderTrailsMap(res[0], res[1]);
        }).catch(function (e) {
            console.error("Не удалось загрузить базу локаций или слепок следов:", e);
            showHint();
        });

        function renderTrailsMap(locations, washereSnapshot) {
            var urlParams = new URLSearchParams(window.location.search);
            var data = (urlParams.get('data') || '').trim();

            // Валидный data — ровно 8 символов, все из base64-алфавита
            var validData = (data.length === 8);
            if (validData) {
                var chk = decodeB64(data.slice(0, 2)) >= 0 &&
                          decodeB64(data.slice(2, 4)) >= 0 &&
                          decodeB64(data.slice(4, 8)) >= 0;
                if (!chk) validData = false;
            }

            var userQuant = null, currentCount = 0, everCount = 0;
            if (validData) {
                userQuant    = data.slice(0, 2);
                currentCount = decodeB64(data.slice(2, 4));
                everCount    = decodeB64(data.slice(4, 8));
            } else {
                showHint();
            }

            // Ищем локацию юзера
            var currentUserLocationId = null;
            var activeGroup = "moscow_orbit";
            if (validData) {
                for (var locId in locations) {
                    if (!locations.hasOwnProperty(locId)) continue;
                    var loc = locations[locId];
                    if (loc.quants && loc.quants.indexOf(userQuant) !== -1) {
                        currentUserLocationId = locId;
                        activeGroup = loc.group;
                        break;
                    }
                }
                if (!currentUserLocationId) {
                    validData = false;
                    showHint();
                }
            }

            // Карта следов: слепок + перетирание кванта юзера
            var washere = {};
            for (var q in washereSnapshot) {
                if (washereSnapshot.hasOwnProperty(q)) washere[q] = washereSnapshot[q];
            }
            if (validData) washere[userQuant] = everCount;

            var myMap = new ymaps.Map("map", { center: [55.5, 38.0], zoom: 11, controls: ['zoomControl'] });
            var mapZoom = 11;
            if (activeGroup === "ural_orbit")        mapZoom = 10;
            else if (activeGroup === "europe")       mapZoom = 7;
            else if (activeGroup === "global_space") mapZoom = 2;

            if (validData && currentUserLocationId) {
                myMap.setCenter(locations[currentUserLocationId].coords, mapZoom);
            }

            for (var locId in locations) {
                if (!locations.hasOwnProperty(locId)) continue;
                var loc = locations[locId];

                var totalEver = 0;
                var balloonLegend = "";

                if (loc.quants && loc.quants.length > 0) {
                    loc.quants.forEach(function (qCode) {
                        var cnt = washere[qCode] || 0;
                        totalEver += cnt;
                        // Синие: «5 побывало», «21 побывал», «101 побывал»
                        var wasWord = plural(cnt, "побывал", "побывало", "побывало");
                        balloonLegend += "• " + getLoraQuantName(qCode) +
                                         ": <b>" + cnt + "</b> " + wasWord + "<br>";
                    });
                }

                var isUserHere = (validData && locId === currentUserLocationId);
                var preset  = 'islands#circleIcon';
                var color   = '#8b949e';
                var caption = '';
                var z       = 100;

                if (totalEver > 0) {
                    color   = '#0088ff';
                    caption = String(totalEver);
                    z       = 500;
                }
                if (isUserHere) {
                    preset  = 'islands#circleDotIcon';
                    color   = '#00ff66';
                    caption = 'Я';
                    z       = 1000;
                }

                var displayName = (loc.name && loc.name.trim() !== "") ? loc.name : "Локация #" + locId;
                var balloon = "<div style='font-family: monospace; font-size: 12px;'>";
                if (isUserHere) {
                    var nowWord  = plural(currentCount, "читатель", "читателя", "читателей");
                    var everWord = plural(everCount,    "побывал",  "побывало", "побывало");
                    balloon += "<b style='color:#00ff66;'>[ ВЫ ЗДЕСЬ ]</b><br>";
                    balloon += "Сейчас здесь: <b>" + currentCount + "</b> " + nowWord + "<br>";
                    balloon += "Ранее здесь " + everWord + ": <b>" + everCount + "</b><br><br>";
                }
                balloon += "<b>Следы читателей:</b><br>" + (balloonLegend || "• Пока никого");
                balloon += "</div>";

                var pm = new ymaps.Placemark(loc.coords, {
                    balloonContentHeader: displayName,
                    balloonContentBody: balloon,
                    iconCaption: caption
                }, {
                    preset: preset,
                    iconColor: color,
                    zIndex: z
                });
                myMap.geoObjects.add(pm);
            }
        }
    });
</script>
</body>
</html>
