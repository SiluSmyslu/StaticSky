<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EBAVGD // OPENLAYERS RADAR</title>
    <!-- Подключаем независимый OpenLayers из открытого стабильного CDN -->
    <link rel="stylesheet" href="https://cloudflare.com" />
    <script src="https://cloudflare.com"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #07090e; }
        #map { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        .version-tag {
            position: absolute; top: 10px; left: 10px; background: rgba(13,17,23,0.9);
            color: #388bfd; padding: 6px 12px; border: 1px solid #30363d; border-radius: 4px;
            font-family: monospace; font-size: 12px; font-weight: bold; z-index: 1000;
        }
    </style>
</head>
<body>

<div class="version-tag">SYSTEM // OPENLAYERS v8.2.0</div>
<div id="map"></div>

<script>
    // Создаем карту на движке OpenLayers
    const map = new ol.Map({
        target: 'map',
        // Подключаем российские тайлы Спутника (Ростелеком)
        layers: [
            new ol.layer.Tile({
                source: new ol.source.XYZ({
                    url: 'https://sputnik.ru{z}/{x}/{y}.png'
                })
            })
        ],
        view: new ol.View({
            center: ol.proj.fromLonLat([50.0, 55.0]), // Центрируем на РФ
            zoom: 4
        }),
        controls: [] // Убираем лишние кнопки управления
    });

    // Функция создания маркера Ноды
    function addNodeMarker(lon, lat, text) {
        const marker = new ol.Feature({
            geometry: new ol.geom.Point(ol.proj.fromLonLat([lon, lat]))
        });
        
        // Стилизуем маркер под тактическую синюю точку
        marker.setStyle(new ol.style.Style({
            image: new ol.style.Circle({
                radius: 7,
                fill: new ol.style.Fill({ color: '#388bfd' }),
                stroke: new ol.style.Stroke({ color: '#ffffff', width: 2 })
            })
        }));

        const vectorSource = new ol.source.Vector({ features: [marker] });
        const vectorLayer = new ol.layer.Vector({ source: vectorSource });
        map.addLayer(vectorLayer);
    }

    // Ставим три базовые Ноды на карту
    addNodeMarker(37.2855, 55.3544); // Аэродром Троицк
    addNodeMarker(13.7373, 51.0504); // Набережная Эльбы
    addNodeMarker(37.6173, 55.7558); // Сектор Карлова
</script>

</body>
</html>
