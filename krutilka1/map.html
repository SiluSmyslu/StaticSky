<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EBAVGD // ТАКТИЧЕСКИЙ РАДАР</title>
    <!-- Официальный API Яндекс Карт -->
    <script src="https://yandex.ru" type="text/javascript"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #07090e; overflow: hidden; font-family: monospace; }
        
        /* Жестко фиксируем карту на весь экран */
        #map { 
            width: 100vw; 
            height: 100vh; 
            position: absolute; 
            top: 0; 
            left: 0; 
            z-index: 1; 
        }
        
        /* ИЗОЛИРОВАННЫЙ ДИАГНОСТИЧЕСКИЙ БЛОК ПОВЕРХ КАРТЫ */
        #debug-panel {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(13, 17, 23, 0.95);
            color: #ffaa00;
            padding: 10px 15px;
            border: 1px solid #30363d;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
            z-index: 1000; /* Жестко поверх карты */
            box-shadow: 0 0 15px rgba(255,170,0,0.2);
            max-width: 80vw;
            word-break: break-all;
        }
        .status-line { color: #8b949e; margin-bottom: 6px; font-size: 11px; }
    </style>
</head>
<body>

<!-- Диагностическая панель -->
<div id="debug-panel">
    <div class="status-line">SYSTEM // DEBUG_LAYER v4.1.1</div>
    <div>ПЕРЕХВАЧЕННЫЕ ДАННЫЕ:</div>
    <div id="raw-output" style="color: #00ff66; margin-top: 4px;">ОЖИДАНИЕ...</div>
</div>

<div id="map"></div>

<script type="text/javascript">
    // 🔍 1. ПЕРВЫЙ ИЗОЛИРОВАННЫЙ СЛОЙ: Старый дубовый разбор ссылки без URLSearchParams
    var searchString = window.location.search;
    var cleanData = "Параметр 'data' отсутствует.";

    if (searchString) {
        // Бьем строку по знаку "="
        var parts = searchString.split("data=");
        if (parts.length > 1) {
            // Забираем всё, что идет после "data="
            cleanData = parts[1].split("&")[0]; 
        }
    }

    // Мгновенно выводим текст в плашку, не дожидаясь никаких загрузок
    document.getElementById('raw-output').innerHTML = cleanData;

    // 🗺️ 2. ВТОРОЙ ИЗОЛИРОВАННЫЙ СЛОЙ: Девственно чистый запуск оригинального Яндекса
    ymaps.ready(function () {
        var myMap = new ymaps.Map("map", {
            center: [55.0, 50.0], // Центрируем на РФ
            zoom: 4,
            controls: ['zoomControl']
        });

        var nodeMatrix = [
            { name: 'НОДА Е // Аэродром Троицк', coords: [55.3544, 37.2855] },
            { name: 'НОДА Б // Набережная Эльбы', coords: [51.0504, 13.7373] },
            { name: 'НОДА Г // Сектор Карлова', coords: [55.7558, 37.6173] }
        ];

        nodeMatrix.forEach(function(item) {
            var placemark = new ymaps.Placemark(item.coords, {
                balloonContentHeader: item.name,
                balloonContentBody: 'Плотность контуров: 0 (ПУСТО)'
            }, {
                preset: 'islands#darkOrangeDotIcon'
            });
            myMap.geoObjects.add(placemark);
        });
    });
</script>

</body>
</html>
