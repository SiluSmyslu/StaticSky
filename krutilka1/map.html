<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EBAVGD // ТАКТИЧЕСКИЙ РАДАР</title>
    <!-- Официальный и независимый API Яндекс Карт -->
    <script src="https://api-maps.yandex.ru/2.1/?lang=ru_RU" type="text/javascript"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #07090e; overflow: hidden; font-family: monospace; }
        #map { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        #version-tag {
            position: absolute; top: 10px; left: 10px; background: rgba(13, 17, 23, 0.95);
            color: #00ff66; padding: 6px 12px; border: 1px solid #30363d; border-radius: 4px;
            font-size: 12px; font-weight: bold; z-index: 1000; box-shadow: 0 0 10px rgba(0,255,102,0.3); pointer-events: none;
        }
        .diagnostic-box { 
            position: absolute; top: 20px; left: 20px; background: rgba(13, 17, 23, 0.90);
            border: 1px solid #30363d; padding: 15px; border-radius: 6px; box-shadow: 0 0 15px rgba(0,255,102,0.2); 
            width: 380px; z-index: 1000; color: #8b949e; font-size: 12px; pointer-events: auto;
        }
        .green-text { color: #00ff66; font-weight: bold; }
        .orange-text { color: #ffaa00; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #30363d; padding: 6px; text-align: left; }
        th { background: #0d1117; color: #00ff66; }
    </style>
</head>
<body>

<div class="diagnostic-box">
    <h3 style="margin-top:0;">SYSTEM // RADAR_STAND v5.6.6</h3>
    <hr style="border: 1px solid #30363d; margin-bottom: 8px;">
    <p style="margin: 4px 0;">Сырая строка: <span id="raw-url" class="orange-text">ПУСТО</span></p>
    <p style="margin: 4px 0;">Текущий квант: <span id="user-quant" class="green-text">НЕ ОПРЕДЕЛЕН</span></p>
    
    <table>
        <thead>
            <tr>
                <th>Квант (B64)</th>
                <th>Плотность (Десятич.)</th>
            </tr>
        </thead>
        <tbody id="result-table">
            <tr>
                <td colspan="2" style="text-align: center; color: #58a6ff;">Ожидание шифра...</td>
            </tr>
        </tbody>
    </table>
</div>

<div id="map"></div>

<script type="text/javascript">
    // Запуск строго по твоему рабочему шаблону v4.4.0 - первой строчкой!
    ymaps.ready(function () {
        
        // 🗺️ 1. Создаем карту (Центр и масштаб из твоей стабильной версии)
        var myMap = new ymaps.Map("map", {
            center: [55.0, 50.0], 
            zoom: 3, 
            controls: ['zoomControl']
        });

        // ⚡ 2. Логика декодера (Опущена внутрь ready, чтобы не ломать парсер браузера)
        var B64_ALPHABET = "0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ-_";
        var urlParams = new URLSearchParams(window.location.search);
        var rawData = (urlParams.get('data') || '').trim();

        if (rawData.length > 0) {
            document.getElementById('raw-url').innerText = rawData;
            var currentUserQuant = "";
            var globalDataString = "";

            if (rawData.length >= 4 && rawData.substr(2, 2) === "ZZ") {
                currentUserQuant = rawData.substr(0, 2);
                globalDataString = rawData.substr(4);
                document.getElementById('user-quant').innerText = currentUserQuant;
            } else {
                globalDataString = rawData;
                document.getElementById('user-quant').innerText = "НЕТ (Без ZZ)";
            }

            if (globalDataString.length >= 4 && globalDataString.length % 4 === 0) {
                var tableBody = document.getElementById('result-table');
                tableBody.innerHTML = "";
                
                for (var i = 0; i < globalDataString.length; i += 4) {
                    var qCode = globalDataString.substr(i, 2);
                    var densityCode = globalDataString.substr(i + 2, 2);
                    
                    // Декодирование Base64 прямо внутри цикла
                    var idx1 = B64_ALPHABET.indexOf(densityCode.charAt(0));
                    var idx2 = B64_ALPHABET.indexOf(densityCode.charAt(1));
                    var realCount = (idx1 === -1 || idx2 === -1) ? 0 : (idx1 * 64) + idx2;

                    tableBody.innerHTML += "<tr><td class='green-text'>" + qCode + "</td><td class='orange-text'>" + realCount + " чел.</td></tr>";
                }
            }
        }
    });
</script>

</body>
</html>
