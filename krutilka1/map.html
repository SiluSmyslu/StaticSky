<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EBAVGD // ТАКТИЧЕСКИЙ РАДАР</title>
    <!-- Официальный и независимый API Яндекс Карт -->
    <script src="https://yandex.ru" type="text/javascript"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #07090e; overflow: hidden; }
        
        /* 🗺️ ЖЕСТКО ФИКСИРУЕМ КАРТУ НА ВЕСЬ ЭКРАН (из рабочего билда v4.0.1) */
        #map { 
            width: 100vw; 
            height: 100vh; 
            position: absolute; 
            top: 0; 
            left: 0; 
            z-index: 1; 
        }
        
        /* 🎛️ ТАКТИЧЕСКИЙ МАРКЕР ВЕРСИИ */
        #version-tag {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(13, 17, 23, 0.95);
            color: #ffaa00; /* Возвращаем ярко-оранжевый маркер триумфа */
            padding: 6px 12px;
            border: 1px solid #30363d;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
            font-weight: bold;
            z-index: 1000;
            box-shadow: 0 0 10px rgba(255,170,0,0.3);
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="version-tag">SYSTEM // INTERFACE_STABLE v4.0.2</div>
<div id="map"></div>

<script type="text/javascript">
    // Проверяем, загрузился ли Яндекс, и запускаем инициализацию
    ymaps.ready(function () {
        var myMap = new ymaps.Map("map", {
            center: [55.0, 50.0], // Центрируем на РФ
            zoom: 4,
            controls: ['zoomControl']
        });

        // Железобетонная сетка базовых точек твоего Лабиринта
        var nodeMatrix = [
            { name: 'НОДА Е // Аэродром Троицк', coords: [55.3544, 37.2855] },
            { name: 'НОДА Б // Набережная Эльбы', coords: [51.0504, 13.7373] },
            { name: 'НОДА Г // Сектор Карлова', coords: [55.7558, 37.6173] },
            { name: 'НОДА А // Фаза БДГ-Сна', coords: [59.9343, 30.3351] },
            { name: 'НОДА В // Озеро Света', coords: [52.5200, 13.4050] },
            { name: 'НОДА Д // Суггестивная Погоня', coords: [54.9924, 73.3686] }
        ];

        // Клеим маркеры на карту
        nodeMatrix.forEach(function(item) {
            var placemark = new ymaps.Placemark(item.coords, {
                balloonContentHeader: item.name,
                balloonContentBody: 'Плотность контуров: 0 (ПУСТО)'
            }, {
                preset: 'islands#darkOrangeDotIcon' // Те самые оранжевые точки под лор
            });
            myMap.geoObjects.add(placemark);
        });
    });
</script>

</body>
</html>
