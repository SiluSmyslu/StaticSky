<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EBAVGD // ТАКТИЧЕСКИЙ РАДАР</title>
    <!-- Подключаем официальный, независимый API Яндекс Карт -->
    <script src="https://yandex.ru" type="text/javascript"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #07090e; font-family: monospace; }
        #map { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* 🎛️ ТАКТИЧЕСКИЙ МАРКЕР ВЕРСИИ */
        #version-tag {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(13, 17, 23, 0.9);
            color: #ff7b72; /* Меняем цвет на красный, чтобы сразу увидеть обновление */
            padding: 6px 12px;
            border: 1px solid #30363d;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            z-index: 1000;
            box-shadow: 0 0 10px rgba(255,100,100,0.2);
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="version-tag">SYSTEM // YANDEX_ENGINE v3.0.1</div>

<div id="map"></div>

<script type="text/javascript">
    // Ждем полной загрузки API Яндекса
    ymaps.ready(init);

    function init() {
        // Создаем карту и центрируем на географическом центре
        var myMap = new ymaps.Map("map", {
            center: [55.0, 50.0],
            zoom: 4,
            controls: ['zoomControl']
        });

        // 🗺️ Сетка Происшествий мета-романа (6 базовых точек)
        const nodeMatrix = [
            { name: 'НОДА Е // Аэродром Троицк', coords: [55.3544, 37.2855] },
            { name: 'НОДА Б // Набережная Эльбы', coords: [51.0504, 13.7373] },
            { name: 'НОДА Г // Сектор Карлова', coords: [55.7558, 37.6173] },
            { name: 'НОДА А // Фаза БДГ-Сна', coords: [59.9343, 30.3351] },
            { name: 'НОДА В // Озеро Света', coords: [52.5200, 13.4050] },
            { name: 'НОДА Д // Суггестивная Погоня', coords: [54.9924, 73.3686] }
        ];

        // Расставляем железные тестовые маркеры на карте Яндекса
        nodeMatrix.forEach(function(item) {
            var myPlacemark = new ymaps.Placemark(item.coords, {
                balloonContentHeader: item.name,
                balloonContentBody: 'Плотность когнитивных контуров: 0 (ПУСТО)'
            }, {
                preset: 'islands#darkGreenDotIcon' // Стильные темно-зеленые точки под лор
            });
            
            myMap.geoObjects.add(myPlacemark);
        });
    }
</script>

</body>
</html>
