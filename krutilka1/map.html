<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EBAVGD // ТАКТИЧЕСКИЙ РАДАР</title>
    <!-- Официальный и независимый API Яндекс Карт -->
    <script src="https://api-maps.yandex.ru/2.1/?lang=ru_RU" type="text/javascript"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #07090e; overflow: hidden; }
        
        /* 🗺️ ЖЕСТКО ФИКСИРУЕМ КАРТУ НА ВЕСЬ ЭКРАН */
        #map { 
            width: 100vw; 
            height: 100vh; 
            position: absolute; 
            top: 0; 
            left: 0; 
            z-index: 1; 
        }
        
        /* 🎛️ ТАКТИЧЕСКИЙ МАРКЕР ВЕРСИИ */
        #version-tag {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(13, 17, 23, 0.95);
            color: #ffaa00; 
            padding: 6px 12px;
            border: 1px solid #30363d;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
            font-weight: bold;
            z-index: 1000;
            box-shadow: 0 0 10px rgba(255,170,0,0.3);
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="version-tag">SYSTEM // INTERFACE_RADAR v4.2.0</div>
<div id="map"></div>

<script type="text/javascript">
    // Проверяем, загрузился ли Яндекс, и запускаем инициализацию
    ymaps.ready(function () {
        var myMap = new ymaps.Map("map", {
            center: [55.0, 50.0], // Центрируем на РФ
            zoom: 4,
            controls: ['zoomControl']
        });

        // Сетка базовых точек твоего Лабиринта
        var nodeMatrix = [
            { code: 'E', name: 'НОДА Е // Аэродром Троицк', coords: [55.3544, 37.2855] },
            { code: 'B', name: 'НОДА Б // Набережная Эльбы', coords: [51.0504, 13.7373] },
            { code: 'G', name: 'НОДА Г // Сектор Карлова', coords: [55.7558, 37.6173] }
        ];

        // Забираем сырую строку параметров из URL
        var currentSearch = window.location.search || '';

        // Клеим маркеры на карту
        nodeMatrix.forEach(function(item) {
            
            var densityNum = 0; // По умолчанию ноль людей
            var letterPosition = currentSearch.indexOf(item.code);
            
            if (letterPosition !== -1) {
                var nextChar = currentSearch.charAt(letterPosition + 1);
                var parsedNum = parseInt(nextChar, 10);
                if (!isNaN(parsedNum)) {
                    densityNum = parsedNum;
                }
            }

            // 🎨 НАСТРОЙКА ЦВЕТА И ТЕКСТА РАДАРНЫХ КРУГОВ
            var nodeColor = '#8b949e';  // По умолчанию суровый серый для нуля читателей
            var markerCaption = '';     // Для пустых комнат надпись рядом оставляем чистой
            var densityText = '0 (ПУСТО)';

            if (densityNum > 0) {
                nodeColor = '#ffaa00';  // Твой стабильный оранжевый цвет для активных зон
                markerCaption = String(densityNum); // Выводим чистую цифру плотности рядом с кругом
                densityText = '<b>' + densityNum + ' контуров</b>';
            }

            var placemark = new ymaps.Placemark(item.coords, {
                balloonContentHeader: item.name,
                balloonContentBody: '<div style="font-family: monospace; font-size: 12px;">Плотность контуров: ' + densityText + '</div>',
                // 📡 Выводим цифру плотности текстовой подписью справа от кружка
                iconCaption: markerCaption 
            }, {
                // Превращаем каплю в круг с центром на точке
                preset: 'islands#circleIcon',
                // Динамически красим векторный круг (оранжевый или серый)
                iconColor: nodeColor
            });
            
            myMap.geoObjects.add(placemark);
        });
    });
</script>

</body>
</html>
