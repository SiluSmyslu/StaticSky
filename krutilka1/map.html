<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EBAVGD MAP</title>
    <!-- Базовые скрипты Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #07090e; }
        #map { width: 100%; height: 100%; }
    </style>
</head>
<body>

<div id="map"></div>

<script>
    // Создаем карту и центрируем на России
    var map = L.map('map', { zoomControl: false }).setView([55.0, 50.0], 4);

    // 🇷🇺 ИМПОРТОЗАМЕЩЕННЫЙ СЛОЙ ТАЙЛОВ: подтягиваем карту из независимого источника
    L.tileLayer('https://yandex.net{x}&y={y}&z={z}&scale=1', {
        maxZoom: 18,
        attribution: '© Yandex'
    }).addTo(map);

    // Ставим три железных тестовых маркера
    L.marker([55.3544, 37.2855]).addTo(map).bindPopup('НОДА Е // Аэродром Троицк');
    L.marker([51.0504, 13.7373]).addTo(map).bindPopup('НОДА Б // Набережная Эльбы');
    L.marker([55.7558, 37.6173]).addTo(map).bindPopup('НОДА Г // Сектор Карлова');
</script>

</body>
</html>
