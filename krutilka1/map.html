<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EBAVGD // ТЕСТОВЫЙ СТЕНД ДЕКОДЕРА</title>
    <style>
        body, html { margin: 0; padding: 20px; background: #07090e; color: #8b949e; font-family: monospace; font-size: 14px; }
        .diagnostic-box { background: rgba(13, 17, 23, 0.95); border: 1px solid #30363d; padding: 15px; border-radius: 6px; box-shadow: 0 0 15px rgba(0,255,102,0.1); max-width: 600px; margin: 0 auto; }
        .green-text { color: #00ff66; font-weight: bold; }
        .orange-text { color: #ffaa00; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #30363d; padding: 8px; text-align: left; }
        th { background: #0d1117; color: #00ff66; }
    </style>
</head>
<body>

<div class="diagnostic-box">
    <h2>SYSTEM // DECODER_STAND v5.6.0_TEST</h2>
    <hr style="border: 1px solid #30363d;">
    
    <p>Сырая строка из URL: <span id="raw-url" class="orange-text">ПУСТО</span></p>
    <p>Текущий квант пользователя: <span id="user-quant" class="green-text">НЕ ОПРЕДЕЛЕН</span></p>
    
    <h3>РАСШИФРОВАННЫЙ ШЛЕЙФ ПЛОТНОСТИ:</h3>
    <table>
        <thead>
            <tr>
                <th>Код кванта (Base64)</th>
                <th>Число читателей (Десятичное)</th>
            </tr>
        </thead>
        <tbody id="result-table">
            <tr>
                <td colspan="2" style="text-align: center; color: #58a6ff;">Ожидание шифра данных...</td>
            </tr>
        </tbody>
    </table>
</div>

<script type="text/javascript">
    var B64_ALPHABET = "0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ-_";

    // Базовый декодер пары символов
    function decodeB64(chars) {
        if (!chars || chars.length !== 2) return 0;
        var idx1 = B64_ALPHABET.indexOf(chars.charAt(0));
        var idx2 = B64_ALPHABET.indexOf(chars.charAt(1));
        return (idx1 === -1 || idx2 === -1) ? 0 : (idx1 * 64) + idx2;
    }

    // Запускаем парсинг параметров строки
    var urlParams = new URLSearchParams(window.location.search);
    var rawData = (urlParams.get('data') || '').trim();

    if (rawData.length > 0) {
        document.getElementById('raw-url').innerText = rawData;

        var currentUserQuant = "ОТСУТСТВУЕТ (Голая ссылка)";
        var globalDataString = "";

        // Проверяем и обходим маркер безопасности "ZZ"
        if (rawData.length >= 4 && rawData.substr(2, 2) === "ZZ") {
            currentUserQuant = rawData.substr(0, 2);
            globalDataString = rawData.substr(4);
            document.getElementById('user-quant').innerText = currentUserQuant + " (Сдвиг за маркер ZZ)";
        } else {
            globalDataString = rawData;
            document.getElementById('user-quant').innerText = "ОТСУТСТВУЕТ (Заход без ZZ префикса)";
        }

        // Нарезка шлейфа по 4 символа
        if (globalDataString.length >= 4 && globalDataString.length % 4 === 0) {
            var tableBody = document.getElementById('result-table');
            tableBody.innerHTML = ""; // Очищаем заглушку ожидания

            for (var i = 0; i < globalDataString.length; i += 4) {
                var qCode = globalDataString.substr(i, 2);
                var densityCode = globalDataString.substr(i + 2, 2);
                var realCount = decodeB64(densityCode);

                // Добавляем строчку в нашу экранную таблицу
                var row = "<tr><td class='green-text'>" + qCode + "</td><td class='orange-text'>" + realCount + " человек</td></tr>";
                tableBody.innerHTML += row;
            }
        } else if (globalDataString.length > 0) {
            document.getElementById('result-table').innerHTML = "<tr><td colspan='2' style='color:#f85149;'>ОШИБКА: Длина шлейфа данных не кратна 4 символам!</td></tr>";
        }
    }
</script>

</body>
</html>
