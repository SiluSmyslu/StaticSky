<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EBAVGD // ТАКТИЧЕСКИЙ РАДАР</title>
    <!-- Официальный API Яндекс Карт -->
    <script src="https://yandex.ru" type="text/javascript"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #07090e; overflow: hidden; font-family: monospace; }
        
        /* Жестко фиксируем карту во весь экран */
        #map { 
            width: 100vw; 
            height: 100vh; 
            position: absolute; 
            top: 0; 
            left: 0; 
            z-index: 1; 
        }
        
        /* 🎛️ ТАКТИЧЕСКИЙ МАРКЕР ВЕРСИИ */
        #version-tag {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(13, 17, 23, 0.95);
            color: #00ff66; /* Сигнальный зеленый */
            padding: 6px 12px;
            border: 1px solid #30363d;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            z-index: 1000;
            box-shadow: 0 0 10px rgba(0,255,102,0.3);
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="version-tag">SYSTEM // DATA_ENGINE v5.0.2</div>
<div id="map"></div>

<script type="text/javascript">
    // 1. ДЕШИФРАТОР СТРОКИ ИЗ URL (?data={{AREHERE}})
    const urlParams = new URLSearchParams(window.location.search);
    const rawData = urlParams.get('data') || '';

    // Функция точного подсчета 21-значных ID читателей на основе регулярки
    function extractNodeDensity(nodeCode) {
        if (!rawData) return 0;
        
        // Регулярное выражение ищет маркер Ноды и все приклеенные за ним ID
        const regex = new RegExp(nodeCode + '_(?:_\\d{20})*', 'g');
        const match = rawData.match(regex);
        if (!match) return 0;
        
        // Берем первое совпадение из массива и высчитываем чистую длину хвоста
        const matchedString = match[0];
        const cleanTail = matchedString.replace(nodeCode + '_', '');
        return Math.floor(cleanTail.length / 21);
    }

    // 2. Инициализация карты Яндекса
    ymaps.ready(function () {
        var myMap = new ymaps.Map("map", {
            center: [54.0, 45.0], // Центрируем радар
            zoom: 4,
            controls: ['zoomControl']
        });

        // Полная географическая матрица Происшествий мета-романа (6 Нод)
        const nodeMatrix = [
            { code: 'Е1', name: 'НОДА Е // Аэродром Троицк', coords: [55.3544, 37.2855], desc: 'Линейный экшен, полярный транзит.' },
            { code: 'Б1', name: 'НОДА Б // Набережная Эльбы', coords: [51.0504, 13.7373], desc: 'Билингвальный сдвиг, демонтаж Стелы.' },
            { code: 'Г1', name: 'НОДА Г // Сектор Карлова', coords: [55.7558, 37.6173], desc: 'Философия фашин, дворовые формулы.' },
            { code: 'А1', name: 'НОДА А // Фаза БДГ-Сна', coords: [59.9343, 30.3351], desc: 'Матрёшка восприятия, оперативники.' },
            { code: 'В1', name: 'НОДА В // Озеро Света', coords: [52.5200, 13.4050], desc: 'Рекурсивные каламбуры Моргунова.' },
            { code: 'Д1', name: 'НОДА Д // Суггестивная Погоня', coords: [54.9924, 73.3686], desc: 'Параллельное зрение, взлом зрительной коры.' }
        ];

        // 3. Динамический рендеринг маркеров на основе плотности данных
        nodeMatrix.forEach(function(item) {
            const density = extractNodeDensity(item.code);
            
            // Если люди есть — красим метку в сочный зеленый и открываем бабл автоматически. 
            // Если пусто — оставляем серую иконку в режиме ожидания.
            const markerPreset = density > 0 ? 'islands#darkGreenDotIconWithCaption' : 'islands#darkGrayDotIcon';
            const densityStatus = density > 0 
                ? '<b style="color: #2ea043;">' + density + ' контуров</b>' 
                : '<span style="color: #8b949e;">0 (ПУСТО)</span>';

            var placemark = new ymaps.Placemark(item.coords, {
                balloonContentHeader: item.name,
                balloonContentBody: '<p>' + item.desc + '</p><p>Плотность когнитивных процессоров в сети: ' + densityStatus + '</p>',
                iconCaption: density > 0 ? 'АКТИВНА [' + density + ']' : '' // Выводим счетчик прямо на карту, если там кто-то есть
            }, {
                preset: markerPreset
            });

            myMap.geoObjects.add(placemark);

            // Автоматически разворачиваем бабл для обитаемых зон
            if (density > 0) {
                placemark.balloon.open();
            }
        });
    });
</script>

</body>
</html>
