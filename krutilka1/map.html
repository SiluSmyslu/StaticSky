html<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EBAVGD // ТАКТИЧЕСКИЙ РАДАР</title>
    <!-- Подключаем стили и скрипты Leaflet напрямую из CDN -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #07090e; font-family: monospace; overflow: hidden; }
        #map { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* Инвертируем карту в суровый ночной киберпанк-радар */
        .leaflet-layer, .leaflet-control-zoom-in, .leaflet-control-zoom-out {
            filter: invert(100%) hue-rotate(190deg) brightness(85%) contrast(110%) saturate(70%);
        }
        
        /* Стилизация всплывающих окон Терминала */
        .leaflet-popup-content-wrapper { background: #0d1117; color: #58a6ff; border: 1px solid #30363d; border-radius: 4px; box-shadow: 0 0 15px rgba(0,255,100,0.1); }
        .leaflet-popup-tip { background: #0d1117; border: 1px solid #30363d; }
        .popup-title { color: #2ea043; font-weight: bold; border-bottom: 1px solid #30363d; padding-bottom: 4px; margin-bottom: 6px; font-size: 14px; }
        .popup-metric { font-size: 12px; color: #c9d1d9; margin: 2px 0; }
        .popup-count { font-weight: bold; }
    </style>
</head>
<body>

<div id="map"></div>

<script>
    // 1. Координатная сетка Происшествий мета-романа (6 базовых Нод)
    const nodeMatrix = {
        'Е1': { name: 'НОДА Е // Аэродром Троицк', coords: [55.3544, 37.2855], desc: 'Линейный экшен, полярный транзит.' },
        'Б1': { name: 'НОДА Б // Набережная Эльбы', coords: [51.0504, 13.7373], desc: 'Билингвальный сдвиг, демонтаж Стелы.' },
        'Г1': { name: 'НОДА Г // Сектор Карлова', coords: [55.7558, 37.6173], desc: 'Философия фашин, дворовые формулы.' },
        'А1': { name: 'НОДА А // Фаза БДГ-Сна', coords: [59.9343, 30.3351], desc: 'Матрёшка восприятия, оперативники.' },
        'В1': { name: 'НОДА В // Озеро Света', coords: [52.5200, 13.4050], desc: 'Рекурсивные каламбуры Моргунова.' },
        'Д1': { name: 'НОДА Д // Суггестивная Погоня', coords: [54.9924, 73.3686], desc: 'Параллельное зрение, взлом зрительной коры.' }
    };

    // 2. Инициализация карты-интерфейса
    const map = L.map('map', { zoomControl: false }).setView([54.0000, 35.0000], 4);
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    // Загружаем бесплатный слой карты OpenStreetMap
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 12,
        minZoom: 3,
        attribution: 'EBAVGD // EXOCORTEX RADAR'
    }).addTo(map);

    // 3. ПАРТИЗАНСКИЙ ДЕШИФРАТОР СТРОКИ {{AREHERE}}
    // Забираем данные из ссылки (URL-параметр ?data=...)
    const urlParams = new URLSearchParams(window.location.search);
    const rawData = urlParams.get('data') || '';

    // Функция вычисления плотности читателей в Ноде
    function extractNodeDensity(nodeCode) {
        if (!rawData) return 0;
        // Строим регулярку под твой текстовый регистр (находит "Г1_" и все идущие за ним ID)
        const regex = new RegExp(nodeCode + '_(?:_\\d{20})*', 'g');
        const match = rawData.match(regex);
        if (!match) return 0;
        
        // Отсекаем префикс Ноды и делим чистую длину оставшегося ID-хвоста на 21 символ
        const cleanTail = match[0].replace(nodeCode + '_', '');
        return Math.floor(cleanTail.length / 21);
    }

    // 4. Рендеринг тактических маркеров (Отображаются ВСЕ локации)
    for (const [code, info] of Object.entries(nodeMatrix)) {
        const density = extractNodeDensity(code);
        
        // Ставим маркер на карту в любом случае
        const marker = L.marker(info.coords).addTo(map);
        
        // Настраиваем подпись в зависимости от того, есть ли в комнате люди
        const statusText = density > 0 
            ? `Плотность когнитивных контуров: <span class="popup-count" style="color: #2ea043;">${density}</span>` 
            : `Плотность когнитивных контуров: <span class="popup-count" style="color: #8b949e;">0 (ПУСТО)</span>`;
        
        // Формируем внутренности всплывающего окошка
        const popupContent = `
            <div class="popup-title" style="${density === 0 ? 'color: #8b949e; border-color: #21262d;' : ''}">${info.name}</div>
            <div class="popup-metric" style="margin-bottom: 8px;">${info.desc}</div>
            <div class="popup-metric">${statusText}</div>
        `;
        
        marker.bindPopup(popupContent);
        
        // Если люди в Ноде есть — бабл открывается автоматически. Пустые — ждут клика.
        if (density > 0) {
            marker.openPopup();
        }
    }
</script>
</body>
</html>
