<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EBAVGD // ТАКТИЧЕСКИЙ РАДАР</title>
    <!-- Официальный и независимый API Яндекс Карт -->
    <script src="https://yandex.ru" type="text/javascript"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #07090e; overflow: hidden; }
        
        /* 🗺️ ЖЕСТКО ФИКСИРУЕМ КАРТУ НА ВЕСЬ ЭКРАН (из стабильного билда v4.0.2) */
        #map { 
            width: 100vw; 
            height: 100vh; 
            position: absolute; 
            top: 0; 
            left: 0; 
            z-index: 1; 
        }
        
        /* 🎛️ ТАКТИЧЕСКИЙ МАРКЕР ВЕРСИИ */
        #version-tag {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(13, 17, 23, 0.95);
            color: #00ff66; /* Зеленый маркер финальной зачистки */
            padding: 6px 12px;
            border: 1px solid #30363d;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
            font-weight: bold;
            z-index: 1000;
            box-shadow: 0 0 10px rgba(0,255,102,0.3);
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="version-tag">SYSTEM // INTERFACE_HYBRID v4.0.7</div>
<div id="map"></div>

<script type="text/javascript">
    // 🔍 1. ЖЕЛЕЗОБЕТОННЫЙ ДЕШИФРАТОР (Защищен от null и пустых строк)
    function getDensity(nodeLetter) {
        try {
            var params = new URLSearchParams(window.location.search);
            var data = params.get('data');
            
            // Если параметра data вообще нет в ссылке — сразу выдаем ноль без расчетов
            if (!data) return '0 (ПУСТО)';
            
            var idx = data.indexOf(nodeLetter);
            if (idx === -1) return '0 (ПУСТО)';
            
            var charAtNext = data.charAt(idx + 1);
            if (!charAtNext) return '0 (ПУСТО)';
            
            var num = parseInt(charAtNext, 10);
            if (isNaN(num)) return '0 (ПУСТО)';
            
            return num > 0 ? '<b>' + num + ' контуров</b>' : '0 (ПУСТО)';
        } catch (e) {
            return '0 (ПУСТО)'; // В любой непонятной ситуации возвращаем стандартный ноль
        }
    }

    // 2. Стабильный запуск Яндекс Карт (Один в один как в v4.0.2)
    ymaps.ready(function () {
        var myMap = new ymaps.Map("map", {
            center: [55.0, 50.0], // Центрируем на РФ
            zoom: 4,
            controls: ['zoomControl']
        });

        // Железобетонная сетка базовых точек твоего Лабиринта
        var nodeMatrix = [
            { code: 'E', name: 'НОДА Е // Аэродром Троицк', coords: [55.3544, 37.2855] },
            { code: 'B', name: 'НОДА Б // Набережная Эльбы', coords: [51.0504, 13.7373] },
            { code: 'G', name: 'НОДА Г // Сектор Карлова', coords: [55.7558, 37.6173] },
            { code: 'A', name: 'НОДА А // Фаза БДГ-Сна', coords: [59.9343, 30.3351] },
            { code: 'V', name: 'НОДА В // Озеро Света', coords: [52.5200, 13.4050] },
            { code: 'D', name: 'НОДА Д // Суггестивная Погоня', coords: [54.9924, 73.3686] }
        ];

        // Клеим маркеры на карту
        nodeMatrix.forEach(function(item) {
            var currentDensity = getDensity(item.code);

            var placemark = new ymaps.Placemark(item.coords, {
                balloonContentHeader: item.name,
                balloonContentBody: '<div style="font-family: monospace; font-size: 12px;">Плотность контуров: ' + currentDensity + '</div>'
            }, {
                preset: 'islands#darkOrangeDotIcon' // Те самые стабильные оранжевые точки
            });
            myMap.geoObjects.add(placemark);
        });
    });
</script>

</body>
</html>
