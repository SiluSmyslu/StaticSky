<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EBAVGD // ТАКТИЧЕСКИЙ РАДАР</title>
    <!-- Официальный и независимый API Яндекс Карт -->
    <script src="https://yandex.ru" type="text/javascript"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #07090e; overflow: hidden; font-family: monospace; }
        
        /* 🗺️ ЖЕСТКО ФИКСИРУЕМ КАРТУ НА ВЕСЬ ЭКРАН */
        #map { 
            width: 100vw; 
            height: 100vh; 
            position: absolute; 
            top: 0; 
            left: 0; 
            z-index: 1; 
        }
        
        /* 🎛️ ТАКТИЧЕСКИЙ ДИАГНОСТИЧЕСКИЙ БЛОК (как на твоем скриншоте) */
        #version-tag {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(13, 17, 23, 0.95);
            color: #ffaa00;
            padding: 12px;
            border: 1px solid #30363d;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            z-index: 1000;
            box-shadow: 0 0 10px rgba(255,170,0,0.2);
            pointer-events: none;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<!-- Диагностическая плашка -->
<div id="version-tag">
    SYSTEM // DEBUG_LAYER v4.1.0<br>
    <span style="color: #ffaa00;">ПЕРЕХВАЧЕННЫЕ ДАННЫЕ:</span><br>
    <span id="debug-data" style="color: #00ff66;">ОЖИДАНИЕ...</span>
</div>

<!-- Контейнер карты -->
<div id="map"></div>

<script type="text/javascript">
    // 1. ПЕРЕХВАТ ДАННЫХ ИЗ URL И ВЫВОД В ПЛАШКУ
    var urlParams = new URLSearchParams(window.location.search);
    var rawData = urlParams.get('data') || '';
    var debugDataSpan = document.getElementById('debug-data');
    
    if (rawData) {
        debugDataSpan.innerHTML = rawData;
    } else {
        debugDataSpan.innerHTML = "null / пустая строка";
        debugDataSpan.style.color = "#ff7b72";
    }

    // 2. Стабильный запуск Яндекс Карт
    ymaps.ready(function () {
        var myMap = new ymaps.Map("map", {
            center: [55.0, 50.0], // Центрируем на РФ
            zoom: 4,
            controls: ['zoomControl']
        });

        // Исправленная координатная сетка без опечаток в структуре объектов
        var nodeMatrix = [
            { code: 'E', name: 'НОДА Е // Аэродром Троицк', coords: [55.3544, 37.2855] },
            { code: 'B', name: 'НОДА Б // Набережная Эльбы', coords: [51.0504, 13.7373] },
            { code: 'G', name: 'НОДА Г // Сектор Карлова', coords: [55.7558, 37.6173] },
            { code: 'A', name: 'НОДА А // Фаза БДГ-Сна', coords: [59.9343, 30.3351] },
            { code: 'V', name: 'НОДА В // Озеро Света', coords: [52.5200, 13.4050] },
            { code: 'D', name: 'НОДА Д // Суггестивная Погоня', coords: [54.9924, 73.3686] }
        ];

        // Клеим маркеры на карту
        nodeMatrix.forEach(function(item) {
            var placemark = new ymaps.Placemark(item.coords, {
                balloonContentHeader: item.name,
                balloonContentBody: 'Плотность контуров: 0 (ПУСТО)'
            }, {
                preset: 'islands#darkOrangeDotIcon' // Стабильные оранжевые метки
            });
            myMap.geoObjects.add(placemark);
        });
    });
</script>

</body>
</html>
