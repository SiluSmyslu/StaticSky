<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EBAVGD // ТАКТИЧЕСКИЙ РАДАР</title>
    <!-- Официальный и независимый API Яндекс Карт -->
    <script src="https://api-maps.yandex.ru/2.1/?lang=ru_RU" type="text/javascript"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #07090e; overflow: hidden; }
        
        /* 🗺️ ЖЕСТКО ФИКСИРУЕМ КАРТУ НА ВЕСЬ ЭКРАН (из твоего рабочего шаблона) */
        #map { 
            width: 100vw; 
            height: 100vh; 
            position: absolute; 
            top: 0; 
            left: 0; 
            z-index: 1; 
        }
        
        /* 🎛️ ТАКТИЧЕСКИЙ МАРКЕР ВЕРСИИ */
        #version-tag {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(13, 17, 23, 0.95);
            color: #ffaa00; 
            padding: 6px 12px;
            border: 1px solid #30363d;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
            font-weight: bold;
            z-index: 1000;
            box-shadow: 0 0 10px rgba(255,170,0,0.3);
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="version-tag">SYSTEM // INTERFACE_FIXED v4.0.1_DATA</div>
<div id="map"></div>

<script type="text/javascript">
    // Проверяем, загрузился ли Яндекс, и запускаем инициализацию
    ymaps.ready(function () {
        var myMap = new ymaps.Map("map", {
            center: [55.0, 50.0], // Центрируем на РФ
            zoom: 4,
            controls: ['zoomControl']
        });

        // Сетка базовых точек твоего Лабиринта
        var nodeMatrix = [
            { code: 'E', name: 'НОДА Е // Аэродром Троицк', coords: [55.3544, 37.2855] },
            { code: 'B', name: 'НОДА Б // Набережная Эльбы', coords: [51.0504, 13.7373] },
            { code: 'G', name: 'НОДА Г // Сектор Карлова', coords: [55.7558, 37.6173] }
        ];

        // 🔍 ЗАБИРАЕМ СЫРУЮ СТРОКУ ПАРАМЕТРОВ ИЗ ССЫЛКИ
        var currentSearch = window.location.search || '';

        // Клеим маркеры на карту
        nodeMatrix.forEach(function(item) {
            
            // 🔍 ЩАДЯЩИЙ ПАРСИНГ: Ищем индекс буквы Ноды (E, B или G) прямо в строке URL
            var currentDensity = '0 (ПУСТО)';
            var letterPosition = currentSearch.indexOf(item.code);
            
            if (letterPosition !== -1) {
                // Если буква найдена, берем символ, который идет сразу за ней
                var nextChar = currentSearch.charAt(letterPosition + 1);
                var parsedNum = parseInt(nextChar, 10);
                
                // Если это реальное число и оно больше нуля — меняем текст в баллоне
                if (!isNaN(parsedNum) && parsedNum > 0) {
                    currentDensity = '<b>' + parsedNum + ' контуров</b>';
                }
            }

            var placemark = new ymaps.Placemark(item.coords, {
                balloonContentHeader: item.name,
                // Изменяем только эту строчку, подставляя вычисленный текст
                balloonContentBody: 'Плотность контуров: ' + currentDensity
            }, {
                preset: 'islands#darkOrangeDotIcon' 
            });
            myMap.geoObjects.add(placemark);
        });
    });
</script>

</body>
</html>
