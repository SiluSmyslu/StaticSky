<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EBAVGD // ТАКТИЧЕСКИЙ РАДАР</title>
    <!-- Официальный и независимый API Яндекс Карт -->
    <script src="https://yandex.ru" type="text/javascript"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #07090e; overflow: hidden; }
        #map { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        
        #version-tag {
            position: absolute; top: 10px; left: 10px; background: rgba(13, 17, 23, 0.95);
            color: #00ff66; padding: 6px 12px; border: 1px solid #30363d; border-radius: 4px;
            font-family: monospace; font-size: 12px; font-weight: bold; z-index: 1000;
            box-shadow: 0 0 10px rgba(0,255,102,0.3); pointer-events: none;
        }
    </style>
</head>
<body>

<div id="version-tag">SYSTEM // INTERFACE_GEODESIC v4.6.1</div>
<div id="map"></div>

<script type="text/javascript">
    ymaps.ready(function () {
        var myMap = new ymaps.Map("map", {
            center: [50.0, 35.0], // Центрируем между Турцией и Питером
            zoom: 4,
            controls: ['zoomControl']
        });

        // Твой оригинальный стабильный цикл Нод
        var nodeMatrix = [
            { code: 'E', name: 'НОДА Е // Аэродром Троицк', coords: [55.3544, 37.2855] },
            { code: 'B', name: 'НОДА Б // Набережная Эльбы', coords: [51.0504, 13.7373] },
            { code: 'G', name: 'НОДА Г // Сектор Карлова', coords: [55.7558, 37.6173] }
        ];

        var currentSearch = window.location.search || '';

        nodeMatrix.forEach(function(item) {
            var densityNum = 0;
            var letterPosition = currentSearch.indexOf(item.code);
            if (letterPosition !== -1) {
                var nextChar = currentSearch.charAt(letterPosition + 1);
                var parsedNum = parseInt(nextChar, 10);
                if (!isNaN(parsedNum)) { densityNum = parsedNum; }
            }

            var nodeColor = '#8b949e'; var markerCaption = ''; var densityText = '0 (ПУСТО)';
            if (densityNum > 0) {
                nodeColor = '#ffaa00'; markerCaption = String(densityNum); densityText = '<b>' + densityNum + ' контуров</b>';
            }

            var placemark = new ymaps.Placemark(item.coords, {
                balloonContentHeader: item.name,
                balloonContentBody: '<div style="font-family: monospace; font-size: 12px;">Плотность контуров: ' + densityText + '</div>',
                iconCaption: markerCaption 
            }, { preset: 'islands#circleIcon', iconColor: nodeColor });
            myMap.geoObjects.add(placemark);
        });

        // 📐 ЧЕСТНАЯ ГЕОДЕЗИЧЕСКАЯ ЛИНИЯ ТРАНЗИТА (ОРТОДРОМИЯ)
        // Задаем всего 2 точки, а Яндекс сам изогнет их по сфере глобуса
        var kmlArcLine = new ymaps.Polyline([
            [37.81150797240639, 29.10686925689524], // Начало: Турция
            [59.83522443279734, 29.05377771227504]  // Конец: Финский залив
        ], {
            balloonContentHeader: "ЛИНИЯ ТРАНЗИТА // ОРТОДРОМИЯ",
            balloonContentBody: "<div style='font-family: monospace; font-size: 12px;'>Вектор трансляции сигнала по кратчайшей дуге на глобусе.</div>"
        }, {
            strokeColor: "#ffaa00",    // Оранжевый тактический
            strokeWidth: 3,            // Толщина
            strokeOpacity: 0.8,        // Прозрачность
            strokeStyle: 'shortdash',   // Пунктир
            
            // 🔥 ГЛАВНАЯ СЕКРЕТНАЯ ОПЦИЯ ЯНДЕКСА: включает честный изгиб по геодезической дуге
            geodesic: true             
        });

        myMap.geoObjects.add(kmlArcLine);
    });
</script>

</body>
</html>
